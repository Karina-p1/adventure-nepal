{# Usage: {% include "components/form_field.html" with field=form.email %} #}
<div class="mb-3">
  {% if field.label %}<label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
</div>
