{% extends "base.html" %}
{% block title %}Password Reset Complete — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="py-5"><div class="container auth-card text-center" style="max-width: 480px;">
  <h1 class="fw-bold mb-3">Password updated</h1>
  <p class="text-muted-custom mb-4">You can now log in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
</div></section>
{% endblock %}
