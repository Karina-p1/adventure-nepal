<div class="mb-3">
  <label for="{{ form.q.id_for_label }}" class="form-label">Search</label>
  {{ form.q }}
</div>
<div class="mb-3">
  <label for="{{ form.region.id_for_label }}" class="form-label">Region</label>
  {{ form.region }}
</div>
<div class="mb-3">
  <label for="{{ form.category.id_for_label }}" class="form-label">Trip type</label>
  {{ form.category }}
</div>
<div class="mb-3">
  <label for="{{ form.difficulty.id_for_label }}" class="form-label">Difficulty</label>
  {{ form.difficulty }}
</div>
<div class="mb-3">
  <label for="{{ form.duration.id_for_label }}" class="form-label">Duration</label>
  {{ form.duration }}
</div>
<div class="mb-3">
  <label class="form-label">Price range (USD)</label>
  <div class="d-flex gap-2">{{ form.price_min }}{{ form.price_max }}</div>
</div>
{% if form.non_field_errors %}<div class="text-danger small mb-2">{{ form.non_field_errors }}</div>{% endif %}
