{% extends "base.html" %}
{% block title %}Log In — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container auth-card" style="max-width: 420px;">
    <h1 class="fw-bold mb-4" data-aos="fade-up">Log in</h1>
    <form method="post" data-aos="fade-up" data-once>
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username or email</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
      <a href="{% url 'accounts:signup' %}{% if next %}?next={{ next }}{% endif %}">Create an account</a>
    </div>
  </div>
</section>
{% endblock %}
