{% extends "base.html" %}
{% block title %}Review {{ trek.title }} — Adventure Nepal{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container" style="max-width: 600px;">
    <h1 class="fw-bold mb-1" data-aos="fade-up">Review: {{ trek.title }}</h1>
    <p class="text-secondary mb-4" data-aos="fade-up">Share your experience with other trekkers</p>

    <form method="post" data-aos="fade-up">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Rating</label>
        {{ form.rating }}
      </div>
      <div class="mb-3">
        <label class="form-label">Title (optional)</label>
        {{ form.title }}
      </div>
      <div class="mb-3">
        <label class="form-label">Your Review</label>
        {{ form.comment }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit Review</button>
    </form>
  </div>
</section>
{% endblock %}
